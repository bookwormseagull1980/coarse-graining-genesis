# Coarse-Graining Genesis Framework V5.0
# Author: Jinku Guo <guojk@nwpu.edu.cn>
# Northwestern Polytechnical University, Xi'an 710072, China
# ORCID: 0009-0000-6600-6171
# References:
# DOI: 10.2139/ssrn.7421398  A Spectral Construction of Natural-Number Arithmetic
# DOI: 10.5281/zenodo.22067118  The Spectrum of a Compact Internal Space I: Gauge Structure and a Scalar Mass Gap
# DOI: 10.48550/arXiv.2607.24329  The Spectrum of a Compact Internal Space II: Effective Couplings and Mass Scales
# DOI: 10.48550/arXiv.2607.21621  A Spectral Criterion for Emergent Gravity
# DOI: 10.48550/arXiv.2608.01989  Coarse-Graining and Long-Range Response in Generated Systems
# DOI: 10.5281/zenodo.22512592  The Spectrum of a Compact Internal Space III: Finite-Window Dynamics of Cosmic Structure Formation
# Full bibliography: REFERENCES.md and CITATION.cff.
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coarse-graining-genesis"
version = "5.0.2"
description = "Coarse-Graining Genesis Framework V5.0.2 — an auditable spectral source-to-observable calculation chain across couplings, matter, gravity and cosmology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jinku Guo", email = "guojk@nwpu.edu.cn" }]
keywords = ["coarse-graining", "spectral-geometry", "mathematical-physics", "computational-physics", "cosmology", "reproducible-research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
# Runtime dependencies (the computation chain): scipy (q0-integrals,
# spectral sums), numpy (tensor kernels), mpmath (outward interval
# certificates) and CAMB (full endpoint power spectrum) are required.
dependencies = [
    "scipy>=1.10",
    "numpy>=1.24",
    "mpmath>=1.3",
    "camb==2.0.5",
]

[project.optional-dependencies]
# Verification of the calculation and its mathematical contracts.
verification = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["cg_core", "cg_core.*", "cg_frg", "cg_frg.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "physics: declared-formula checks and numerical regressions",
    "store: tests that read cg_params.json (the run-time store)",
    "numerical: independent quadrature, interval bounds, refinement and complete response calculations",
    "auxiliary: presentation and reviewer-interface checks",
    "release_audit: complete source/store audits, also executed directly by the release verifier",
]
