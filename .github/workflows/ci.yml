name: Core verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt "pytest>=7.4" "mpmath>=1.3"

      - name: Run core verification suite
        run: python scripts/verify_v5.py --no-reproduce --pytest --test-scope core
