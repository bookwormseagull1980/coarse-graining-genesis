name: Core verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run quickstart
        run: python examples/quickstart/run_example.py

      - name: Check the complete response in a moving source frame
        run: python -B examples/check_common_frame_response.py

      - name: Run core verification suite
        run: python -m pytest -q -m "not numerical and not auxiliary" -p no:cacheprovider
